creation_rules:
  - path_regex: opencloud/secrets/secrets(\.enc)?\.yaml$
    key_groups:
      - age:
        - &main_pq ""
  - path_regex: (traefik|element|element-call|synapse|metrics|nextcloud|certs|wireguard|backup|sing-box|system|firewall|router|i2p|mirotalk)/secrets/secrets(\.enc)?\.yaml$
    key_groups:
      - age:
        - &main "age1p9r276rvjh98r93nsvqhzuhlqnawur0j0hn34qmeangcd94mlchqgvm820"
  - path_regex: secrets/hosts(\.enc)?\.yaml$
    key_groups:
      - age:
        - *main
        - *main_pq
